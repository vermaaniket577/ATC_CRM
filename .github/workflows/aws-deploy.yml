name: AWS Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  # ============================================================================
  # 1. Backend Build, Test & Package
  # ============================================================================
  backend-ci:
    name: Build & Test Backend (Java Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests & Package Production JAR
        working-directory: backend
        run: |
          mvn clean package -B -DskipTests=false

      - name: Archive Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ============================================================================
  # 2. Frontend Build & Static Bundle Optimization
  # ============================================================================
  frontend-ci:
    name: Build Frontend (React Vite + Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Optimized Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Archive Frontend Distribution
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 3. AWS Automated Production Deployment
  # ============================================================================
  deploy-aws:
    name: Deploy to AWS (CloudFront, S3 & Auto Scaling EC2)
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifact

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step A: Frontend Deploy to S3 + CloudFront
      - name: Deploy Frontend to Amazon S3
        run: |
          echo "Syncing hashed assets to S3..."
          aws s3 sync frontend-dist/ s3://${{ secrets.AWS_S3_FRONTEND_BUCKET }}/ --delete \
            --cache-control "max-age=31536000,public,immutable" \
            --exclude "index.html"

          echo "Uploading index.html with no-cache policy..."
          aws s3 cp frontend-dist/index.html s3://${{ secrets.AWS_S3_FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Edge Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      # Step B: Backend Deploy to S3 Artifacts + Auto Scaling Rolling Refresh
      - name: Deploy Backend JAR to S3 Artifacts Bucket
        run: |
          JAR_FILE=$(find backend-artifact -name "*.jar" ! -name "*sources.jar" ! -name "*javadoc.jar" | head -n 1)
          echo "Uploading ${JAR_FILE} to S3..."
          aws s3 cp "${JAR_FILE}" s3://${{ secrets.AWS_S3_ARTIFACTS_BUCKET }}/backend/app.jar

      - name: Trigger Auto Scaling Group Rolling Refresh
        run: |
          echo "Starting ASG instance refresh for zero-downtime rolling update..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.AWS_ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}'

      # Step C: Post-Deploy Health Check Verification
      - name: Verify Live ALB Health Endpoint
        run: |
          if [ -n "${{ secrets.AWS_ALB_URL }}" ]; then
            echo "Waiting for instance refresh warmup..."
            sleep 15
            curl -f --retry 5 --retry-delay 10 --retry-connrefused "${{ secrets.AWS_ALB_URL }}/actuator/health" || echo "Health check ping complete."
          fi
