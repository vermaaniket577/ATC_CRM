version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: telecom-crm-mysql
    restart: always
    environment:
      MYSQL_DATABASE: telecom_crm
      MYSQL_USER: telecom_app
      MYSQL_PASSWORD: telecom_secret_pass
      MYSQL_ROOT_PASSWORD: telecom_root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "telecom_app", "-ptelecom_secret_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - telecom-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: telecom-crm-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/telecom_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: telecom_app
      SPRING_DATASOURCE_PASSWORD: telecom_secret_pass
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - telecom-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: telecom-crm-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - telecom-network

volumes:
  mysql_data:
    driver: local

networks:
  telecom-network:
    driver: bridge
